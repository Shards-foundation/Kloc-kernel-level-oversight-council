name: KLOC validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify independent council rules
        run: npm test
      - name: Type-check and bundle application
        run: npm run build
      - name: Verify client bundle contains no provider key or ESM import map
        run: npm run check:bundle
